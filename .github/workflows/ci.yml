name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, imap
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: |
          find app bot api admin cron config install public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
